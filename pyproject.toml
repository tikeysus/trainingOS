[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trainingos"
version = "0.1.0"
description = "Local-first personal running intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "fitdecode>=0.10,<0.11",
    "garminconnect>=0.3,<0.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trainingos.storage.sql" = ["*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
